# --- Batch 1 of the harder questions: document versioning, and the first
# --- underspecified question. Added after the corpus grew to 10 documents.

- id: q51
  cohort: extended
  type: underspecified
  phrasing: prose
  # q35 without the supplier name. Two framework agreements answer it equally
  # well and neither is more correct, so the system should give both or say the
  # answer depends on which supplier is meant.
  question: A supplier stays below the OTIF target for three consecutive quarters. What can the distributor do about the contract?
  expected_documents:
    - delivery_sla
    - supplier_framework_agreement
    - supplier_framework_agreement_pedalworks
  expected_facts: ["Velocore", "Pedalworks"]
  anchors:
    - "OTIF below target for three consecutive quarters | Executive review, contract at risk"
    - "terminate for convenience with 6 months' written notice"
    - "terminate for convenience with 3 months' written notice"
  expected_answer: It depends on the supplier. Three consecutive quarters below target is a material breach under both framework agreements, so either contract can be terminated if the breach is not remedied within 30 days; the agreements differ elsewhere, including notice for convenience, six months for Velocore and three for Pedalworks.

