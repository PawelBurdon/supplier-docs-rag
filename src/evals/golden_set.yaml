    - "1 percent of the order value per day late, capped at 15 percent"
  expected_answer: The sources disagree. Clause 5.1 of the SLA says 0.5 percent of order value per calendar day, capped at 10 percent; the internal FAQ says 1 percent per day capped at 15 percent.

