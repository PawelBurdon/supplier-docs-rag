- id: q19
  type: factual
  phrasing: code
  question: Under clause 3.3 of HCS-FA-2024-011, when may the supplier request a price adjustment?
  expected_documents: [supplier_framework_agreement]
  expected_facts: ["6 percent"]
  anchors:
    - "moved by more than 6 percent since the last"
  expected_answer: Once per calendar year, with 90 days written notice, and only where the aluminium or carbon input index has moved by more than 6 percent since the last adjustment.

- id: q20
  type: factual
  phrasing: prose
  question: What caps each party's total liability under the framework agreement?
  expected_documents: [supplier_framework_agreement]
  expected_facts: ["12 months"]
  anchors:
    - "the total value of purchase orders placed in the 12 months preceding the claim"
  expected_answer: The total value of purchase orders placed in the 12 months before the claim, except for death, personal injury and the recall indemnity.

- id: q21
  type: factual
  phrasing: prose
  question: Who pays for a product recall caused by a manufacturing defect?
  expected_documents: [supplier_framework_agreement]
  expected_facts: ["supplier"]
  anchors:
    - "the Supplier bears the full cost of the recall"
  expected_answer: The supplier bears the full cost, including the distributor's logistics and customer communication costs.

- id: q22
  type: factual
  phrasing: prose
  question: How quickly must a supplier acknowledge a purchase order?
  expected_documents: [delivery_sla]
  expected_facts: ["2 business days"]
  anchors:
    - "Acknowledgement is due within 2 business"
  expected_answer: Within 2 business days of receipt; an unacknowledged order starts its lead time clock on the third business day anyway.

- id: q23
  type: factual
  phrasing: code
  question: Under HCS-SLA-2024, who owns a level 3 escalation and what is the response time?
  expected_documents: [delivery_sla]
  expected_facts: ["Head of Procurement", "5 business days"]
  anchors:
    - "OTIF below target for two consecutive quarters | Head of Procurement | 5 business days"
  expected_answer: The Head of Procurement, with a 5 business day response time, triggered by OTIF below target for two consecutive quarters.

- id: q24
  type: factual
  phrasing: prose
  question: How long are drivetrain components under warranty?
  expected_documents: [returns_and_warranty_policy]
  expected_facts: ["12 months"]
  anchors:
    - "Drivetrain components | DRV-* | 12 months"
  expected_answer: 12 months from the date of the distributor's invoice to the trade customer.

- id: q25
  type: factual
  phrasing: prose
