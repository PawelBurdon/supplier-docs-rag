- id: q34
  type: multi_hop
  phrasing: prose
  question: Velocore missed its OTIF target in the fourth quarter of 2025. Who owns the escalation that triggers, and how fast must they respond?
  expected_documents: [onboarding_velocore_components, delivery_sla]
  expected_facts: ["Head of Procurement"]
  anchors:
    - "The 2025 Q4 miss triggered a level 3 escalation"
    - "OTIF below target for two consecutive quarters | Head of Procurement | 5 business days"
  expected_answer: The Q4 miss triggered a level 3 escalation, which the Delivery SLA assigns to the Head of Procurement with a 5 business day response time.

- id: q35
  type: multi_hop
  phrasing: prose
  # Named the supplier when a second framework agreement entered the corpus:
  # without it, both agreements answer this equally well and the key was
  # arbitrary. The unnamed version is kept as its own question, typed
  # underspecified, because that ambiguity is a real situation worth testing.
  question: Velocore stays below the OTIF target for three consecutive quarters. What can the distributor do about the contract?
  expected_documents: [delivery_sla, supplier_framework_agreement]
  expected_facts: ["material breach"]
  anchors:
    - "OTIF below target for three consecutive quarters | Executive review, contract at risk"
    - "Failure to meet the on-time delivery threshold in the Delivery SLA for"
  expected_answer: Three consecutive quarters below target is a material breach under the framework agreement, so the contract can be terminated if it is not remedied within 30 days; the SLA also escalates it to executive review.

- id: q36
  type: multi_hop
  phrasing: code
  question: Which of our suppliers is approved to deliver WHL-CRB carbon wheelsets?
  expected_documents: [onboarding_pedalworks_manufacturing, onboarding_velocore_components]
  expected_facts: ["not approved"]
  anchors:
    - "Carbon wheelsets (WHL-CRB-*) are not approved"
    - "FRK-ALU-*                       aluminium forks"
  expected_answer: Neither. Carbon wheelsets are not an approved SKU family for Pedalworks, and Velocore is approved only for frame sets and aluminium forks.

- id: q37
  type: multi_hop
  phrasing: prose
  # Key corrected, wording deliberately unchanged. Cassettes are DRV-CST, which
  # the Pedalworks record and the Pedalworks framework agreement both list, and
  # Velocore's scope is frames and forks only -- so the corpus supports the hop
  # from product to supplier to agreement to fee, and the question is hard
  # rather than undecidable. The old key pointed at the Velocore agreement and
  # its EUR 12 fee, which for a cassette is simply the wrong contract.
  question: How long is a cassette under warranty, and what does the supplier reimburse for a valid claim?
  expected_documents: [returns_and_warranty_policy, supplier_framework_agreement_pedalworks]
  expected_facts: ["12 months", "15"]
  anchors:
    - "Drivetrain components | DRV-* | 12 months"
    - "plus a flat handling fee of USD 15 per unit"
  expected_answer: 12 months for drivetrain components. Cassettes come from Pedalworks, whose framework agreement sets the reimbursement at wholesale value plus a flat USD 15 handling fee per unit.

- id: q38
  type: multi_hop
  phrasing: code
  question: Velocore's price validity under HCS-FA-2024-011 has expired. On what basis may they raise prices now?
  expected_documents: [onboarding_velocore_components, supplier_framework_agreement]
  expected_facts: ["6 percent", "90 days"]
  anchors:
    - "Fixed until 28 February 2025"
    - "moved by more than 6 percent since the last"
  expected_answer: Prices were fixed until 28 February 2025; after that, clause 3.3 allows one adjustment per calendar year with 90 days notice and only if the input index has moved more than 6 percent.

- id: q39
  type: multi_hop
  phrasing: prose
  # Third document added to the key. The Pedalworks framework agreement answers
  # this directly in clause 5.4, and it did not exist when the question was
  # written -- the key was incomplete, not the retrieval.
  question: Pedalworks blames ocean freight booking delays for its late deliveries. Does the SLA excuse that?
  expected_documents:
    - onboarding_pedalworks_manufacturing
    - delivery_sla
    - supplier_framework_agreement_pedalworks
  expected_facts: ["force majeure"]
  anchors:
    - "attributes lateness to ocean freight booking"
    - "does not cover raw material price movements"
    - "A delay caused by freight booking is not, of itself, a delay attributable to the Supplier"
  expected_answer: No. Force majeure does not cover a supplier's own subcontractor default, and because the Incoterms are FCA Taichung the freight leg is not the distributor's responsibility, which is why the case is contested at escalation level 2.

